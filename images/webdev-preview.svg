<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15191E" />
      <stop offset="100%" stop-color="#1B222A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F4E8C" />
      <stop offset="100%" stop-color="#3A78C4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="380" rx="8" fill="url(#webBg)" stroke="#2D3742" stroke-width="1.5"/>

  <!-- Browser Header -->
  <rect x="0" y="0" width="760" height="38" rx="8" fill="#181D23"/>
  <rect x="0" y="30" width="760" height="8" fill="#181D23"/>
  <circle cx="20" cy="19" r="5" fill="#E25C54" />
  <circle cx="36" cy="19" r="5" fill="#E6A23C" />
  <circle cx="52" cy="19" r="5" fill="#67C23A" />
  <rect x="80" y="10" width="380" height="18" rx="4" fill="#101418"/>
  <text x="92" y="23" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#7CA3D9">https://dhwanikher.github.io/ — Pure HTML5 &amp; CSS3</text>

  <!-- Split View: CSS Grid / Flexbox Anatomy -->
  <g transform="translate(24, 54)">
    <!-- CSS Grid Layout Demo -->
    <rect width="340" height="236" rx="6" fill="#1C232B" stroke="#2B3642" stroke-width="1"/>
    <text x="18" y="26" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#7CA3D9">CSS Grid 12-Col Responsive Frame</text>
    
    <g transform="translate(18, 40)">
      <rect x="0" y="0" width="304" height="28" rx="4" fill="#24303F" stroke="#374E6B"/>
      <text x="12" y="18" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#93BDE8">&lt;header&gt; Navigation: Flexbox + Sticky</text>

      <rect x="0" y="36" width="198" height="106" rx="4" fill="#1E2833" stroke="#2E4054"/>
      <text x="12" y="56" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#CBD2D8">&lt;main&gt; Content Area</text>
      <text x="12" y="74" font-family="'IBM Plex Sans', sans-serif" font-size="9" fill="#88919A">display: grid; gap: 24px;</text>
      <text x="12" y="90" font-family="'IBM Plex Sans', sans-serif" font-size="9" fill="#88919A">grid-template-columns: repeat(auto-fit, ...)</text>

      <rect x="206" y="36" width="98" height="106" rx="4" fill="#202A36" stroke="#33465C"/>
      <text x="214" y="56" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#CBD2D8">&lt;aside&gt;</text>
      <text x="214" y="74" font-family="'IBM Plex Sans', sans-serif" font-size="9" fill="#88919A">Bento Stack</text>

      <rect x="0" y="150" width="304" height="28" rx="4" fill="#1B222A" stroke="#2B3540"/>
      <text x="12" y="168" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#8B949E">&lt;footer&gt; Semantic Landmark &amp; Copyright</text>
    </g>
  </g>

  <!-- Interactive State Inspection -->
  <g transform="translate(396, 54)">
    <rect width="340" height="236" rx="6" fill="#1C232B" stroke="#2B3642" stroke-width="1"/>
    <text x="18" y="26" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#D08363">Interactivity &amp; Box Model Specs</text>

    <g font-family="'IBM Plex Mono', monospace" font-size="10.5" transform="translate(18, 40)">
      <rect width="304" height="34" rx="4" fill="#151A20" stroke="#28323E"/>
      <text x="12" y="21" fill="#78C68E">:hover, :focus-visible {</text>
      <text x="185" y="21" fill="#8B949E">transform: translateY(-4px);</text>

      <rect y="42" width="304" height="34" rx="4" fill="#151A20" stroke="#28323E"/>
      <text x="12" y="63" fill="#78C68E">@keyframes pulse {</text>
      <text x="165" y="63" fill="#8B949E">0%, 100% { opacity: 1; }</text>

      <rect y="84" width="304" height="34" rx="4" fill="#151A20" stroke="#28323E"/>
      <text x="12" y="105" fill="#78C68E">box-sizing: border-box;</text>
      <text x="195" y="105" fill="#8B949E">zero overflow</text>

      <rect y="126" width="304" height="48" rx="4" fill="#131920" stroke="#202A36"/>
      <text x="12" y="145" fill="#7CA3D9">@media (max-width: 768px) {</text>
      <text x="24" y="162" fill="#E8E5DC">  grid-template-columns: 1fr; /* Mobile First */</text>
    </g>
  </g>

  <!-- Bottom Bar: Zero JS Guarantee -->
  <g transform="translate(24, 304)">
    <rect width="712" height="56" rx="6" fill="#19222E" stroke="#283B52" stroke-width="1"/>
    <text x="24" y="26" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#78C68E">✓ 100% Pure HTML + CSS</text>
    <text x="24" y="44" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#A7ABB1">Zero JavaScript required for navigation, layout adaptation, smooth scrolling, and hover animations.</text>
    <rect x="580" y="14" width="112" height="28" rx="4" fill="#1F4E8C"/>
    <text x="600" y="32" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#FFFFFF">LIVE DEMO</text>
  </g>
</svg>
